<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FinSpark Addis — Ethiopian Daily Economics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>

<body class="flex justify-center min-h-screen p-4 select-none">
    <div class="w-full max-w-md pb-20">

        <!-- Header -->
        <header class="flex justify-between items-center py-3 mb-2">
            <div class="flex items-center gap-2.5">
                <div
                    class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-emerald-400 to-amber-300 flex items-center justify-center font-black text-slate-950 text-sm shadow-lg shadow-emerald-500/20">
                    FS
                </div>
                <div>
                    <h1 class="text-lg font-black tracking-tight text-white leading-none">FinSpark <span
                            class="text-emerald-400">Addis</span></h1>
                    <span class="text-[11px] text-slate-400 font-medium">Tikimt Cycle • Day 26 of 30</span>
                </div>
            </div>
            <button onclick="resetData()"
                class="text-[11px] bg-slate-800/80 hover:bg-slate-700 text-slate-400 hover:text-white px-2.5 py-1 rounded-lg border border-slate-700">
                Reset Data
            </button>
        </header>

        <!-- PaceHero Card -->
        <div id="paceCard"
            class="relative overflow-hidden bg-gradient-to-br from-slate-900 to-slate-800/90 border border-slate-700/60 rounded-3xl p-6 shadow-2xl mb-5">
            <div id="glowBg"
                class="absolute -right-12 -top-12 w-48 h-48 rounded-full blur-3xl opacity-20 bg-emerald-400 pointer-events-none">
            </div>

            <div class="flex justify-between items-center mb-4">
                <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Remaining for Today</span>
                <span id="paceBadge"
                    class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                    ON PACE
                </span>
            </div>

            <div class="flex items-baseline gap-2 mb-4">
                <span id="todayAllowance" class="text-5xl font-black tracking-tight text-emerald-400">0</span>
                <span class="text-lg font-semibold text-slate-400">ETB</span>
            </div>

            <!-- Pace Math Metrics -->
            <div class="grid grid-cols-3 gap-2 pt-4 border-t border-slate-700/60 text-center">
                <div class="bg-slate-800/50 p-2.5 rounded-2xl border border-slate-700/40">
                    <p class="text-[10px] text-slate-400 uppercase font-semibold">Daily Pace</p>
                    <p id="targetPace" class="text-sm font-bold text-white mt-0.5">0 ETB</p>
                </div>
                <div class="bg-slate-800/50 p-2.5 rounded-2xl border border-slate-700/40">
                    <p class="text-[10px] text-slate-400 uppercase font-semibold">Spent Today</p>
                    <p id="spentToday" class="text-sm font-bold text-slate-200 mt-0.5">0 ETB</p>
                </div>
                <div class="bg-slate-800/50 p-2.5 rounded-2xl border border-slate-700/40">
                    <p class="text-[10px] text-slate-400 uppercase font-semibold">Days Left</p>
                    <p class="text-sm font-bold text-amber-300 mt-0.5">5 Days</p>
                </div>
            </div>
        </div>

        <!-- Dual Ledger Isolation Switcher -->
        <div class="flex bg-slate-900/90 p-1 rounded-2xl border border-slate-800 mb-5">
            <button id="tabLiving" onclick="setLedger('LIVING')"
                class="flex-1 py-2.5 text-xs font-bold rounded-xl transition-all bg-emerald-500 text-slate-950 shadow-md">
                🌿 Daily Living Pool
            </button>
            <button id="tabBulk" onclick="setLedger('BULK_CAPITAL')"
                class="flex-1 py-2.5 text-xs font-bold rounded-xl transition-all text-slate-400 hover:text-white flex items-center justify-center gap-1.5">
                <span>📦 Pantry / Sinks</span>
                <span id="bulkBadge"
                    class="text-[10px] bg-slate-800 text-amber-300 px-2 py-0.5 rounded-full border border-slate-700">5,700
                    ETB</span>
            </button>
        </div>

        <!-- One-Tap Addis Quick-Log Grid -->
        <section class="mb-6">
            <div class="flex justify-between items-center mb-2.5 px-1">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300">⚡ 1-Tap Addis Transit & Coffee
                </h2>
                <span class="text-[10px] text-slate-500">Instant Log</span>
            </div>

            <div class="grid grid-cols-3 gap-2">
                <button onclick="logQuick('Taxi to Kera', 15, 'TRANSIT_MINIBUS', 'LIVING')"
                    class="flex flex-col items-center p-3 bg-slate-900/90 hover:bg-slate-850 active:scale-95 border border-slate-800 hover:border-slate-700 rounded-2xl transition">
                    <span class="text-xl mb-1">🚐</span>
                    <span class="text-xs font-semibold text-slate-200">Kera</span>
                    <span class="text-[11px] font-bold text-emerald-400 mt-0.5">15 ETB</span>
                </button>

                <button onclick="logQuick('Taxi to Wello Sefer', 20, 'TRANSIT_MINIBUS', 'LIVING')"
                    class="flex flex-col items-center p-3 bg-slate-900/90 hover:bg-slate-850 active:scale-95 border border-slate-800 hover:border-slate-700 rounded-2xl transition">
                    <span class="text-xl mb-1">🚐</span>
                    <span class="text-xs font-semibold text-slate-200">Wello Sefer</span>
                    <span class="text-[11px] font-bold text-emerald-400 mt-0.5">20 ETB</span>
                </button>

                <button onclick="logQuick('Taxi to Alem Cinema', 25, 'TRANSIT_MINIBUS', 'LIVING')"
                    class="flex flex-col items-center p-3 bg-slate-900/90 hover:bg-slate-850 active:scale-95 border border-slate-800 hover:border-slate-700 rounded-2xl transition">
                    <span class="text-xl mb-1">🚐</span>
                    <span class="text-xs font-semibold text-slate-200">Alem Cinema</span>
                    <span class="text-[11px] font-bold text-emerald-400 mt-0.5">25 ETB</span>
                </button>

                <button onclick="logQuick('Mexico / Bole', 30, 'TRANSIT_MINIBUS', 'LIVING')"
                    class="flex flex-col items-center p-3 bg-slate-900/90 hover:bg-slate-850 active:scale-95 border border-slate-800 hover:border-slate-700 rounded-2xl transition">
                    <span class="text-xl mb-1">🚐</span>
                    <span class="text-xs font-semibold text-slate-200">Mexico/Bole</span>
                    <span class="text-[11px] font-bold text-emerald-400 mt-0.5">30 ETB</span>
                </button>

                <button onclick="logQuick('Jebena Buna', 20, 'BUNA_CAFE', 'LIVING')"
                    class="flex flex-col items-center p-3 bg-slate-900/90 hover:bg-slate-850 active:scale-95 border border-slate-800 hover:border-slate-700 rounded-2xl transition">
                    <span class="text-xl mb-1">☕</span>
                    <span class="text-xs font-semibold text-slate-200">Jebena Buna</span>
                    <span class="text-[11px] font-bold text-emerald-400 mt-0.5">20 ETB</span>
                </button>

                <button onclick="logQuick('Special Shiro Lunch', 180, 'MEGEB_LUNCH', 'LIVING')"
                    class="flex flex-col items-center p-3 bg-slate-900/90 hover:bg-slate-850 active:scale-95 border border-slate-800 hover:border-slate-700 rounded-2xl transition">
                    <span class="text-xl mb-1">🍲</span>
                    <span class="text-xs font-semibold text-slate-200">Shiro Megeb</span>
                    <span class="text-[11px] font-bold text-emerald-400 mt-0.5">180 ETB</span>
                </button>
            </div>
        </section>

        <!-- Custom Log Form -->
        <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 mb-6">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Custom Entry</h3>
            <form onsubmit="handleCustomSubmit(event)" class="space-y-2.5">
                <div class="flex gap-2">
                    <input id="inputTitle" type="text" placeholder="Description (e.g. 5L Oil, Bajajj)" required
                        class="flex-1 bg-slate-800 border border-slate-700 text-sm rounded-xl px-3 py-2 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-400">
                    <input id="inputAmount" type="number" placeholder="ETB" required min="1"
                        class="w-24 bg-slate-800 border border-slate-700 text-sm rounded-xl px-3 py-2 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-400">
                </div>
                <div class="flex gap-2 items-center">
                    <select id="inputLedger"
                        class="flex-1 bg-slate-800 border border-slate-700 text-xs rounded-xl px-2 py-2 text-slate-200 focus:outline-none">
                        <option value="LIVING">Living Pool (Deducts Daily Pace)</option>
                        <option value="BULK_CAPITAL">Pantry / Sink (Isolated from Pace)</option>
                    </select>
                    <button type="submit"
                        class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs px-4 py-2 rounded-xl transition">
                        + Log
                    </button>
                </div>
            </form>
        </div>

        <!-- Transaction Feed -->
        <section>
            <div class="flex justify-between items-center mb-3 px-1">
                <h2 id="feedTitle" class="text-xs font-bold uppercase tracking-wider text-slate-300">Living Pool Feed
                </h2>
                <span id="txCount" class="text-[10px] text-slate-500"></span>
            </div>
            <div id="txList" class="space-y-2"></div>
        </section>

    </div>

    <script>
        // 26-Day Realistic Tikimt Seed Data
        const INITIAL_TIKIMT_TRANSACTIONS = [
            { id: '1', title: '5L Sunflower Cooking Oil', amount: 3800, ledger: 'BULK_CAPITAL', category: 'BULK_PANTRY', day: 1, time: 'Day 1' },
            { id: '2', title: 'Berbere & Shiro Powder', amount: 2500, ledger: 'BULK_CAPITAL', category: 'BULK_PANTRY', day: 1, time: 'Day 1' },
            { id: '3', title: 'Taxi to Wello Sefer', amount: 20, ledger: 'LIVING', category: 'TRANSIT_MINIBUS', day: 1, time: 'Day 1' },
            { id: '4', title: 'Macchiato at Bole', amount: 30, ledger: 'LIVING', category: 'BUNA_CAFE', day: 1, time: 'Day 1' },
            { id: '5', title: 'Minibus to Mexico', amount: 25, ledger: 'LIVING', category: 'TRANSIT_MINIBUS', day: 5, time: 'Day 5' },
            { id: '6', title: 'Haircut & Beard Trim', amount: 450, ledger: 'BULK_CAPITAL', category: 'GROOMING', day: 12, time: 'Day 12' },
            { id: '7', title: 'Special Shiro Lunch', amount: 180, ledger: 'LIVING', category: 'MEGEB_LUNCH', day: 25, time: 'Day 25' },
            { id: '8', title: 'Taxi to Kera', amount: 15, ledger: 'LIVING', category: 'TRANSIT_MINIBUS', day: 26, time: 'Today 08:20' },
            { id: '9', title: 'Jebena Buna', amount: 20, ledger: 'LIVING', category: 'BUNA_CAFE', day: 26, time: 'Today 09:10' }
        ];

        const CONFIG = {
            monthName: 'Tikimt',
            totalDays: 30,
            currentDay: 26,
            livingBudget: 18000,
            bulkBudget: 12000
        };

        let activeLedger = 'LIVING';
        let transactions = [];

        function init() {
            const saved = localStorage.getItem('finspark_addis_tx');
            if (saved) {
                try { transactions = JSON.parse(saved); } catch (e) { transactions = [...INITIAL_TIKIMT_TRANSACTIONS]; }
            } else {
                transactions = [...INITIAL_TIKIMT_TRANSACTIONS];
                save();
            }
            render();
        }

        function save() {
            localStorage.setItem('finspark_addis_tx', JSON.stringify(transactions));
        }

        function resetData() {
            if (confirm('Reset to initial 26-day Tikimt prototype data?')) {
                transactions = [...INITIAL_TIKIMT_TRANSACTIONS];
                save();
                render();
            }
        }

        function setLedger(ledger) {
            activeLedger = ledger;
            const tabLiving = document.getElementById('tabLiving');
            const tabBulk = document.getElementById('tabBulk');

            if (ledger === 'LIVING') {
                tabLiving.className = 'flex-1 py-2.5 text-xs font-bold rounded-xl transition-all bg-emerald-500 text-slate-950 shadow-md';
                tabBulk.className = 'flex-1 py-2.5 text-xs font-bold rounded-xl transition-all text-slate-400 hover:text-white flex items-center justify-center gap-1.5';
                document.getElementById('feedTitle').innerText = 'Daily Living Transactions';
            } else {
                tabLiving.className = 'flex-1 py-2.5 text-xs font-bold rounded-xl transition-all text-slate-400 hover:text-white';
                tabBulk.className = 'flex-1 py-2.5 text-xs font-bold rounded-xl transition-all bg-amber-400 text-slate-950 shadow-md flex items-center justify-center gap-1.5';
                document.getElementById('feedTitle').innerText = 'Bulk Pantry & Sinks (Isolated)';
            }
            renderFeed();
        }

        function logQuick(title, amount, category, ledger) {
            transactions.unshift({
                id: Date.now().toString(),
                title,
                amount,
                category,
                ledger,
                day: CONFIG.currentDay,
                time: 'Today ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });
            save();
            render();
        }

        function handleCustomSubmit(e) {
            e.preventDefault();
            const title = document.getElementById('inputTitle').value;
            const amount = parseFloat(document.getElementById('inputAmount').value);
            const ledger = document.getElementById('inputLedger').value;

            logQuick(title, amount, 'CUSTOM', ledger);
            document.getElementById('inputTitle').value = '';
            document.getElementById('inputAmount').value = '';
        }

        function render() {
            // 1. Calculate living pace
            const livingTx = transactions.filter(t => t.ledger === 'LIVING');
            const totalSpentLiving = livingTx.reduce((sum, t) => sum + t.amount, 0);
            const remainingPool = Math.max(0, CONFIG.livingBudget - totalSpentLiving);

            const daysRemaining = Math.max(1, CONFIG.totalDays - CONFIG.currentDay + 1); // 5 days left
            const dynamicPace = Math.round(remainingPool / daysRemaining);

            const spentToday = livingTx
                .filter(t => t.day === CONFIG.currentDay)
                .reduce((sum, t) => sum + t.amount, 0);

            const todayAllowance = dynamicPace - spentToday;

            // 2. Calculate bulk remaining
            const bulkTx = transactions.filter(t => t.ledger === 'BULK_CAPITAL');
            const totalBulkSpent = bulkTx.reduce((sum, t) => sum + t.amount, 0);
            const bulkRemaining = Math.max(0, CONFIG.bulkBudget - totalBulkSpent);

            // 3. Update DOM
            document.getElementById('todayAllowance').innerText = todayAllowance.toLocaleString();
            document.getElementById('targetPace').innerText = dynamicPace.toLocaleString() + ' ETB';
            document.getElementById('spentToday').innerText = spentToday.toLocaleString() + ' ETB';
            document.getElementById('bulkBadge').innerText = bulkRemaining.toLocaleString() + ' ETB';

            const badge = document.getElementById('paceBadge');
            const glow = document.getElementById('glowBg');
            const todayText = document.getElementById('todayAllowance');

            if (todayAllowance < 0) {
                badge.innerText = 'OVER PACE';
                badge.className = 'px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-rose-500/20 text-rose-300 border border-rose-500/30';
                glow.className = 'absolute -right-12 -top-12 w-48 h-48 rounded-full blur-3xl opacity-25 bg-rose-500 pointer-events-none';
                todayText.className = 'text-5xl font-black tracking-tight text-rose-400';
            } else if (todayAllowance < dynamicPace * 0.3) {
                badge.innerText = 'TIGHT';
                badge.className = 'px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30';
                glow.className = 'absolute -right-12 -top-12 w-48 h-48 rounded-full blur-3xl opacity-20 bg-amber-400 pointer-events-none';
                todayText.className = 'text-5xl font-black tracking-tight text-amber-400';
            } else {
                badge.innerText = 'ON PACE';
                badge.className = 'px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';
                glow.className = 'absolute -right-12 -top-12 w-48 h-48 rounded-full blur-3xl opacity-20 bg-emerald-400 pointer-events-none';
                todayText.className = 'text-5xl font-black tracking-tight text-emerald-400';
            }

            renderFeed();
        }

        function renderFeed() {
            const feed = document.getElementById('txList');
            const filtered = transactions.filter(t => t.ledger === activeLedger);
            document.getElementById('txCount').innerText = `${filtered.length} entries`;

            if (filtered.length === 0) {
                feed.innerHTML = '<div class="text-center py-8 text-xs text-slate-500">No transactions in this ledger yet.</div>';
                return;
            }

            feed.innerHTML = filtered.map(t => `
        <div class="flex justify-between items-center p-3 bg-slate-900/70 border border-slate-800/80 rounded-2xl">
          <div>
            <p class="text-xs font-semibold text-slate-200">${t.title}</p>
            <p class="text-[10px] text-slate-500">${t.time} • <span class="uppercase">${t.category || t.ledger}</span></p>
          </div>
          <span class="text-xs font-bold ${t.ledger === 'LIVING' ? 'text-emerald-400' : 'text-amber-400'}">-${t.amount.toLocaleString()} ETB</span>
        </div>
      `).join('');
        }

        init();
    </script>
</body>

</html>
